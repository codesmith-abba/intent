name: ITL Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ITL package
        run: python -m pip install .

      - name: Verify installed package metadata
        run: python -c "import itl; assert itl.__version__ == '1.0.0'; print(itl.__version__)"

      - name: Verify installed CLI outside checkout
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          itl --help
          itl init sample
          printf 'app $Sample { page $home {} target $web }\n' > sample/app.itl
          itl check sample
          itl build sample
          test -f sample/.project/app.json

      - name: Run ITL test suite
        run: python -m tests

      - name: Run browser runtime tests
        run: node tests/browser_runtime_test.js
