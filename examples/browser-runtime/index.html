<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITL Browser Runtime</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script src="../../runtime/browser.js"></script>
  <script>
    const runtime = new ITLBrowserRuntime.BrowserRuntime({
      root: document.getElementById("app"),
      assetRoot: "./assets/"
    });
    runtime.start("./.project/runtime.json");
  </script>
</body>
</html>
